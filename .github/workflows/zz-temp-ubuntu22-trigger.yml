name: "zz-temp Ubuntu 22 trigger (DELETE before merge)"

# TEMPORARY pre-merge validation trigger for the Ubuntu 22 x86_64 E2E engine.
# A brand-new engine that isn't on the default branch yet can't be reached by
# workflow_dispatch/schedule, but a push trigger runs from the branch's own
# files. This fires the engine on push to the feature branch so it can be
# validated pre-merge. DELETE THIS FILE before the PR merges.

on:
  push:
    branches:
      - test/ron/ubuntu-22-e2e-engine-workflow

permissions:
  contents: read
  pull-requests: write

jobs:
  ubuntu22:
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-ubuntu-22-amd64.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
    with:
      build_from_source: true
      project: desktop
      r_version: "release"
