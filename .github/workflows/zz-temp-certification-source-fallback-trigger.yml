name: "zz-temp: source-fallback validation run"

# TEMPORARY -- remove on this same PR, before merge. It exists to prove one
# thing: that the required-packages install on macos14 at R 4.1.3 now gets past
# the hard gate by falling back to source. A workflow_dispatch cannot show that,
# because dispatch only reaches workflows already on the default branch, and the
# change under test is not there yet.
#
# One cell and one spec on purpose. The fix is in the provisioning step, so the
# result being read is a green "Install e2e test dependencies" followed by
# globalSetup reporting the library already complete. macos14 at R 4.1.3 also has
# two known pre-existing failures (citations.test.ts, quarto.test.ts) that this
# change neither causes nor fixes, so running the whole suite would bury the
# signal in noise.
#
# version is deliberately empty. A run installs the build from the manifest for
# its own ref's version/RELEASE, which on this branch is Autumn Hawkbit, so the
# latest daily from that manifest is the matched pair. Pinning a 2026.08 version
# here would not resolve at all.
#
# The R library cache saves only from refs/heads/main, so this run is cold and
# compiles devtools, reticulate and shinytest2 from source. That compile is
# exactly what is under test, so the cost is the point rather than waste.

on:
  push:
    branches:
      - test/ron/e2e-workflow-certification-source-fallback

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate:
    name: Source fallback (macos14, R 4.1.3)
    uses: ./.github/workflows/os-test-e2e-rstudio-certification.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      # Forwarded like every other caller, so AI-gated tests are not silently
      # skipped in a run whose whole purpose is to confirm provisioning.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      cells: "macos14"
      test_selector: "sandbox.test.ts"
      build_from_source: false
