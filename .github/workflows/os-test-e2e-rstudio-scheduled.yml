name: "Test: E2E Playwright RStudio (Scheduled Rotation and Run-All, Open Source)"

# One workflow that drives the reusable per-OS E2E "engines" four ways:
#   - Weekday cron (Mon-Fri): a fixed slate per weekday, so every engine runs
#     at least once a week without running the whole matrix daily.
#   - Friday afternoon cron: macOS 14 alone, timed to land inside the October
#     2026 brownout windows for the deprecated macos-14 image (see the pick job).
#   - Weekly cron (Sunday): every engine at once, for a full-matrix snapshot.
#   - Manual dispatch: every engine at once, optionally against a specific daily
#     build (the "version" input) or built from source (the "build_from_source"
#     input).
#
# The Linux Desktop engines all run through the consolidated
# os-test-e2e-rstudio-desktop-linux.yml workflow as a matrix (one entry per
# engine, built dynamically from the pick job's selection); macOS, Windows,
# and Linux Server keep their own reusable workflows.
#
# Binary selection: scheduled runs test the daily build (build_from_source
# false). With no version, each engine self-resolves the latest daily (keeping
# its SHA-256 check); a specific version builds each platform's download URL by
# token-swap, and since there is no per-build manifest that path skips SHA-256
# (see rstudio/latest-builds#251). Manual dispatch can instead build every
# engine from source via build_from_source.
#
# Cron times are UTC: 08:00 UTC is 4 AM EDT in summer, 3 AM EST in winter.

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Mon-Fri 08:00 UTC (4 AM EDT) -- fixed slate per weekday
    - cron: '0 8 * * 0'     # Sunday 08:00 UTC (4 AM EDT) -- all engines (this string must match the check in the pick job)
    - cron: '0 16 * * 5'    # Friday 16:00 UTC (noon EDT) -- macOS 14 only (this string must match the check in the pick job and the concurrency group below)
  workflow_dispatch:
    inputs:
      version:
        description: "Daily build to test, given as the version string exactly as shown on dailies.rstudio.com (e.g. 2026.08.0-daily+44). Leave empty to test the latest daily. Ignored when build_from_source is checked. Applies to every engine."
        type: string
        default: ""
      build_from_source:
        description: "Build every engine from source instead of installing a daily build. Overrides the version input."
        type: boolean
        default: false

concurrency:
  # The Friday 16:00 macOS 14 cron gets its own group: it would otherwise share
  # the one pending slot with the Friday 08:00 weekday slate, and only one run
  # per group can be pending (a third trigger cancels the pending one rather
  # than queueing behind it). Either outcome can push the macOS 14 run out of
  # the brownout window it is timed to land in. Every other trigger keeps the
  # shared group, which caps the fleet at one full rotation at a time.
  #
  # Two trade-offs come with the split. The macOS 14 run may now overlap a
  # weekday slate, contending for the shared macOS runner pool if a morning
  # slate is still going at 16:00 -- Friday's 08:00 slate contains macos26, so
  # that contention is live, exactly as it was when this cron ran on Monday.
  # And because macos14 is in ALL below, a run-everything dispatch (group
  # "main") can now run the macOS 14 engine at the same time as this cron does,
  # which a single shared group used to make impossible.
  group: pw-scheduled-e2e-${{ github.event.schedule == '0 16 * * 5' && 'macos14' || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write  # the engines' e2e-merge job declares this
  # The engines' e2e-merge jobs assume the S3 report-upload role via OIDC,
  # and every engine's build job assumes the S3 sccache role via OIDC; a
  # reusable workflow's id-token grant is capped by its caller's.
  id-token: write

jobs:
  pick:
    name: Pick engines
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.pick.outputs.selected }}
      linux_matrix: ${{ steps.pick.outputs.linux_matrix }}
    steps:
      - id: pick
        name: Select engines for this run
        run: |
          # workflow_dispatch and the Sunday cron run every engine; the weekday
          # cron (Mon-Fri) runs a fixed slate per day; the Friday afternoon cron
          # runs macOS 14 alone.
          # Each engine appears once a week in the weekday slates below, except
          # macos26, windows2025, and ubuntu24s (twice) and macos14, which is in
          # no slate at all -- its weekly run is the Friday 16:00 cron.
          ALL='["fedora43","fedora44","ubuntu26","ubuntu22","ubuntu24d","ubuntu24arm","ubuntu24s","macos26","windows2025","debian13","rocky10","rocky9","macos15","macos14"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 8 * * 0" ]; then
            SEL="$ALL"
          elif [ "${{ github.event.schedule }}" = "0 16 * * 5" ]; then
            # macOS 14 runs on its own Friday-afternoon cron instead of in a
            # weekday slate, so its runs land inside the October 2026 brownout
            # windows for the deprecated macos-14 image. The eight windows all
            # run 14:00-00:00 UTC, on Oct 5, 12, 19 and 26 (Mondays), Oct 16, 23
            # and 30 (Fridays) and Oct 29 (Thursday); the 08:00 slates miss all
            # eight by six hours. A Friday 16:00 run therefore lands inside
            # three of them -- one fewer than Monday's four, which is the cost of
            # this slot. Verified against actions/runner-images#13518.
            # Those failures are the point -- early warning that the image is
            # fully retired on 2026-11-02. No brownout window falls on a Sunday,
            # so the full-matrix cron is unaffected before that date, but a
            # dispatch launched inside any of the eight windows will hit one.
            # After the retirement date this run, the Sunday run, and every
            # dispatch fail until macos14 is removed from this workflow and from
            # ALL above.
            SEL='["macos14"]'
          else
            case "$(date -u +%u)" in   # %u: 1=Mon .. 7=Sun
              1) SEL='["ubuntu24d","macos26","rocky9"]' ;;
              2) SEL='["ubuntu24s","windows2025","rocky10"]' ;;
              3) SEL='["ubuntu26","fedora44","macos15","ubuntu22"]' ;;
              4) SEL='["fedora43","ubuntu24arm","windows2025"]' ;;
              5) SEL='["ubuntu24s","macos26","debian13"]' ;;
              # Only reachable by re-running a weekday run on Sat/Sun, or if the
              # Sunday cron above changed without updating the check above.
              # Fail loudly rather than silently selecting nothing.
              *) echo "::error::No engine slate for weekday $(date -u +%u). If the Sunday cron changed, update the '0 8 * * 0' check in this job."; exit 1 ;;
            esac
          fi
          echo "selected=$SEL" >> "$GITHUB_OUTPUT"
          echo "::notice::Selected engines: $SEL"

          # Map the selected Linux Desktop engines onto the consolidated
          # workflow's matrix: os names the .github/e2e-linux config, arch is
          # the architecture that config is expected to run on (the called
          # workflow fails the run if the two disagree), and url_key names the
          # resolve job's output holding that engine's version-specific
          # installer URL (empty on latest-daily / build-from-source runs).
          # Engines with no daily of their own reuse the nearest build of the
          # same arch: Fedora -> the RHEL 10 daily (rhel10-x86_64 /
          # rhel10-arm64), Debian -> the Ubuntu 24 daily (noble-amd64 /
          # noble-arm64). Every Ubuntu and Rocky engine has a key of its own.
          # See the engine configs.
          TABLE='[
            {"key":"fedora43","os":"fedora-43-x86_64","arch":"x86_64","name":"Fedora 43 (x86_64)","url_key":"rhel"},
            {"key":"fedora44","os":"fedora-44-x86_64","arch":"x86_64","name":"Fedora 44 (x86_64)","url_key":"rhel"},
            {"key":"ubuntu26","os":"ubuntu-26-x86_64","arch":"x86_64","name":"Ubuntu 26 (x86_64)","url_key":"resolute_amd64"},
            {"key":"ubuntu22","os":"ubuntu-22-x86_64","arch":"x86_64","name":"Ubuntu 22 (x86_64)","url_key":"jammy_amd64"},
            {"key":"ubuntu24d","os":"ubuntu-24-x86_64","arch":"x86_64","name":"Ubuntu 24 Desktop (x86_64)","url_key":"noble_amd64"},
            {"key":"ubuntu24arm","os":"ubuntu-24-arm64","arch":"arm64","name":"Ubuntu 24 Desktop (arm64)","url_key":"noble_arm64"},
            {"key":"debian13","os":"debian-13-arm64","arch":"arm64","name":"Debian 13 (arm64)","url_key":"noble_arm64"},
            {"key":"rocky10","os":"rocky-10-arm64","arch":"arm64","name":"Rocky 10 (arm64)","url_key":"rocky"},
            {"key":"rocky9","os":"rocky-9-x86_64","arch":"x86_64","name":"Rocky 9 (x86_64)","url_key":"rhel9"}
          ]'
          LINUX=$(jq -cn --argjson table "$TABLE" --argjson sel "$SEL" \
            '[$table[] | select(.key as $k | $sel | index($k))]')
          echo "linux_matrix=$LINUX" >> "$GITHUB_OUTPUT"
          echo "::notice::Linux Desktop matrix: $LINUX"

  resolve:
    name: Resolve installer URLs
    runs-on: ubuntu-latest
    outputs:
      rhel:         ${{ steps.resolve.outputs.rhel }}
      rhel9:        ${{ steps.resolve.outputs.rhel9 }}
      noble_amd64:  ${{ steps.resolve.outputs.noble_amd64 }}
      server_noble: ${{ steps.resolve.outputs.server_noble }}
      macos:        ${{ steps.resolve.outputs.macos }}
      windows:      ${{ steps.resolve.outputs.windows }}
      noble_arm64:  ${{ steps.resolve.outputs.noble_arm64 }}
      rocky:        ${{ steps.resolve.outputs.rocky }}
      jammy_amd64:  ${{ steps.resolve.outputs.jammy_amd64 }}
      resolute_amd64: ${{ steps.resolve.outputs.resolute_amd64 }}
    steps:
      - id: resolve
        name: Build per-platform installer URLs for a specific version
        env:
          VERSION: ${{ inputs.version }}
          BUILD_FROM_SOURCE: ${{ inputs.build_from_source }}
        run: |
          # Emit empty URLs when building from source (engines build, ignoring
          # any URL) or when no version is given (engines self-resolve the
          # latest daily, keeping their SHA-256 check). Only a specific version
          # needs URLs built here: swap the version token (+ -> -) into each
          # platform's latest download URL.
          if [ "$BUILD_FROM_SOURCE" = "true" ] || [ -z "$VERSION" ]; then
            {
              echo "rhel="
              echo "rhel9="
              echo "noble_amd64="
              echo "server_noble="
              echo "macos="
              echo "windows="
              echo "noble_arm64="
              echo "rocky="
              echo "jammy_amd64="
              echo "resolute_amd64="
            } >> "$GITHUB_OUTPUT"
            echo "No installer URLs to resolve (building from source or using the latest daily)."
            exit 0
          fi
          M=$(curl -fsSL --retry 3 --retry-delay 5 'https://dailies.rstudio.com/rstudio/latest/index.json')
          REQ=${VERSION//+/-}
          emit() {
            local product="$1" key="$2" link ver cur
            link=$(printf '%s' "$M" | jq -r ".products.${product}.platforms[\"${key}\"].link // empty")
            ver=$(printf '%s' "$M" | jq -r ".products.${product}.platforms[\"${key}\"].version // empty")
            cur=${ver//+/-}
            if [ -z "$link" ] || [ -z "$cur" ]; then
              echo "::error::Could not build a URL for ${product}/${key} from the latest manifest." >&2
              return 1
            fi
            local out=${link//$cur/$REQ}
            if [ "$REQ" != "$cur" ] && [ "$out" = "$link" ]; then
              echo "::error::Version '$REQ' did not substitute into the ${product}/${key} URL ($link); the manifest link format may have changed." >&2
              return 1
            fi
            if ! curl -fsI "$out" >/dev/null 2>&1; then
              echo "::error::Resolved URL for ${product}/${key} does not exist: $out (version '$VERSION' may be unavailable or mistyped)." >&2
              return 1
            fi
            printf '%s' "$out"
          }
          # Every emit is fatal on purpose. A missing key yields an empty
          # output, and an empty rstudio_installer_url means "self-resolve the
          # latest daily" to the engines below -- so a non-fatal emit would let
          # a version-pinned dispatch quietly test the latest daily instead of
          # the version asked for. Failing the job is the only way a pin can't
          # be silently ignored.
          RHEL=$(emit electron rhel10-x86_64) || exit 1
          RHEL9=$(emit electron rhel9-x86_64) || exit 1
          NOBLE=$(emit electron noble-amd64) || exit 1
          SERVER=$(emit server noble-amd64) || exit 1
          MAC=$(emit electron macos) || exit 1
          WIN=$(emit electron windows) || exit 1
          NARM=$(emit electron noble-arm64) || exit 1
          ROCKY=$(emit electron rhel10-arm64) || exit 1
          JAMMY=$(emit electron jammy-amd64) || exit 1
          RESOLUTE=$(emit electron resolute-amd64) || exit 1
          {
            echo "rhel=$RHEL"
            echo "rhel9=$RHEL9"
            echo "noble_amd64=$NOBLE"
            echo "server_noble=$SERVER"
            echo "macos=$MAC"
            echo "windows=$WIN"
            echo "noble_arm64=$NARM"
            echo "rocky=$ROCKY"
            echo "jammy_amd64=$JAMMY"
            echo "resolute_amd64=$RESOLUTE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved URLs for version $VERSION."

  # Every selected Linux Desktop engine, one matrix entry each, through the
  # consolidated Linux workflow. The matrix is built (already filtered to the
  # selection) by the pick job; the guard skips the job entirely when no
  # Linux engine is selected, since an empty matrix is an error.
  linux-desktop:
    name: ${{ matrix.name }}
    needs: [pick, resolve]
    if: ${{ needs.pick.outputs.linux_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.linux_matrix) }}
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-linux.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      project: desktop
      r_version: "release"
      build_from_source: ${{ inputs.build_from_source || false }}
      rstudio_installer_url: ${{ needs.resolve.outputs[matrix.url_key] }}

  ubuntu24s:
    name: Ubuntu 24 Server
    needs: [pick, resolve]
    if: ${{ contains(fromJSON(needs.pick.outputs.selected), 'ubuntu24s') }}
    uses: ./.github/workflows/os-test-e2e-rstudio-server-os-ubuntu-24.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      project: server
      r_version: "release"
      build_from_source: ${{ inputs.build_from_source || false }}
      rstudio_installer_url: ${{ needs.resolve.outputs.server_noble }}

  macos26:
    name: macOS 26 arm64
    needs: [pick, resolve]
    if: ${{ contains(fromJSON(needs.pick.outputs.selected), 'macos26') }}
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-macos-26-arm64.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      project: desktop
      r_version: "release"
      build_from_source: ${{ inputs.build_from_source || false }}
      rstudio_installer_url: ${{ needs.resolve.outputs.macos }}

  macos15:
    name: macOS 15 x86_64
    needs: [pick, resolve]
    if: ${{ contains(fromJSON(needs.pick.outputs.selected), 'macos15') }}
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-macos-15-x86_64.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      project: desktop
      r_version: "release"
      build_from_source: ${{ inputs.build_from_source || false }}
      # Same universal macOS .dmg the arm64 engines test; the daily manifest
      # ships one "macos" installer for both architectures.
      rstudio_installer_url: ${{ needs.resolve.outputs.macos }}

  macos14:
    name: macOS 14 arm64
    needs: [pick, resolve]
    if: ${{ contains(fromJSON(needs.pick.outputs.selected), 'macos14') }}
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-macos-14-arm64.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      project: desktop
      r_version: "release"
      build_from_source: ${{ inputs.build_from_source || false }}
      rstudio_installer_url: ${{ needs.resolve.outputs.macos }}

  windows2025:
    name: Windows Server 2025
    needs: [pick, resolve]
    if: ${{ contains(fromJSON(needs.pick.outputs.selected), 'windows2025') }}
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-windows-server-2025.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      project: desktop
      r_version: "release"
      build_from_source: ${{ inputs.build_from_source || false }}
      rstudio_installer_url: ${{ needs.resolve.outputs.windows }}
