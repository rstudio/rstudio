name: "zz-temp: certification workflow validation trigger"

# TEMPORARY -- DELETE BEFORE THIS PR MERGES.
#
# Exists only to exercise os-test-e2e-rstudio-certification.yml on this branch.
# That workflow is new, and workflow_dispatch only reaches workflows already on
# the default branch, so a push trigger is the only way to run it pre-merge.
#
# Deliberately narrow, because a default certification run is 13 full engine
# runs:
#   - two cells, both Linux x86_64 (the cheapest engines), chosen to cover both
#     routes the summary table uses to learn the R version actually installed:
#     ubuntu24d-x86_64 is a Linux Desktop cell, whose version arrives as an
#     uploaded artifact, and ubuntu24s is Linux Server, whose version arrives as
#     a workflow_call output.
#   - one fast test file rather than the whole suite.
#   - no version pin, so the engines self-resolve the latest daily and keep
#     their SHA-256 check.
#
# Both cells are pinned to R 4.4.1 in matrix.json, which is not "release" -- so a
# green run proves the requested version really took effect rather than the
# engines quietly defaulting.
#
# Removal must be its own commit on this same branch, pushed before the PR
# merges. Once this file is on main, deleting it needs a fresh branch and PR,
# because direct pushes to main are blocked.

on:
  push:
    branches:
      - test/ron/e2e-workflow-certification-r-versions

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  certification-smoke:
    name: Certification smoke (2 cells)
    uses: ./.github/workflows/os-test-e2e-rstudio-certification.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
    with:
      cells: "ubuntu24d-x86_64 ubuntu24s"
      test_selector: "sandbox.test.ts"
      build_from_source: false
