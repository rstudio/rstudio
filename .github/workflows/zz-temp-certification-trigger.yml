name: "zz-temp: certification workflow arm64 validation trigger"

# TEMPORARY -- DELETE BEFORE THIS PR MERGES.
#
# Second, narrower validation pass. The first two runs (31404916495, 31407536391)
# proved the workflow end to end but only on x86_64 cells. The default matrix now
# certifies four Linux distros on arm64, and that combination -- a pinned R
# version installed on an arm64 engine, reported back through the artifact -- has
# never actually run.
#
# One cell: ubuntu26-arm64, pinned to R 4.6.1. Chosen over the other three arm64
# cells because Ubuntu 26 is a bare arm64 runner rather than a container, so it
# isolates the arch question from container quirks. One fast test file, and no
# version pin, so the engine self-resolves the latest daily and keeps its
# SHA-256 check.
#
# Removal must be its own commit on this same branch, pushed before the PR
# merges. Once this file is on main, deleting it needs a fresh branch and PR,
# because direct pushes to main are blocked.

on:
  push:
    branches:
      - test/ron/e2e-workflow-certification-r-versions

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  certification-smoke-arm64:
    name: Certification smoke (ubuntu26-arm64)
    uses: ./.github/workflows/os-test-e2e-rstudio-certification.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
    with:
      cells: "ubuntu26-arm64"
      test_selector: "sandbox.test.ts"
      build_from_source: false
