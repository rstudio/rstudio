name: "zz-temp arch-gap Linux trigger (DELETE before merge)"

# TEMPORARY pre-merge validation trigger for the seven new Linux Desktop E2E
# engine configs (the second architecture for Debian 13, Rocky 9, Rocky 10,
# Fedora 43, Fedora 44, Ubuntu 22 and Ubuntu 26) plus the already-existing but
# never-validated ubuntu-24-arm64. Configs that aren't on the default branch
# yet can't be reached by workflow_dispatch or schedule, but a push trigger
# runs from the branch's own files. DELETE THIS FILE before the PR merges.
#
# Two jobs, because the two binary paths run different hooks. With
# build_from_source false the build job is skipped entirely, so build-setup.sh
# never executes; e2e-setup.sh and post-r-setup.sh run either way. The
# source-build set is three engines chosen for coverage rather than
# completeness: ubuntu-22-arm64 exercises the arch-guarded JAVA_HOME fix in
# ubuntu-22/build-setup.sh, ubuntu-26-arm64 is the other bare arm64 runner
# (and the first use of the ubuntu-26.04-arm label anywhere in this repo), and
# rocky-9-arm64 represents the container arm64 shape.

on:
  push:
    branches:
      - test/ron/e2e-linux-workflow-arch-gap

# Every push to the branch fires all eleven runs, so iterating on review
# feedback would otherwise stack whole fleets.
concurrency:
  group: zz-temp-archgap-${{ github.ref }}
  cancel-in-progress: true

# A reusable workflow's grants are capped by its caller's, and GitHub
# validates every permission the called workflow declares at call time --
# even for jobs that end up skipped.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # Installs the latest daily (each engine self-resolves it, keeping the
  # SHA-256 check) and runs the suite. Covers e2e-setup.sh, post-r-setup.sh,
  # the installer download and the arch assertion.
  daily:
    name: daily ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24-arm64, arch: arm64 }
          - { os: debian-13-x86_64, arch: x86_64 }
          - { os: rocky-9-arm64, arch: arm64 }
          - { os: rocky-10-x86_64, arch: x86_64 }
          - { os: fedora-43-arm64, arch: arm64 }
          - { os: fedora-44-arm64, arch: arm64 }
          - { os: ubuntu-22-arm64, arch: arm64 }
          - { os: ubuntu-26-arm64, arch: arm64 }
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-linux.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      project: desktop
      r_version: "release"
      build_from_source: false

  # Builds from this branch's source. Covers build-setup.sh, the new cache-key
  # families, build_timeout_minutes, and the installer_artifact upload-to-
  # download round trip.
  source:
    name: source ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22-arm64, arch: arm64 }
          - { os: ubuntu-26-arm64, arch: arm64 }
          - { os: rocky-9-arm64, arch: arm64 }
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-linux.yml
    secrets:
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      AWS_E2E_REPORTS_ROLE_ARN: ${{ secrets.AWS_E2E_REPORTS_ROLE_ARN }}
      AWS_SCCACHE_ROLE_ARN: ${{ secrets.AWS_SCCACHE_ROLE_ARN }}
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      project: desktop
      r_version: "release"
      build_from_source: true
