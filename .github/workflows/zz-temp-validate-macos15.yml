# TEMPORARY -- validates the macOS 15 x86_64 cache-scope fix on this branch.
# macOS 15 is not part of the PR test matrix, so this push-triggered caller
# runs the engine directly against a daily .dmg (build_from_source: false),
# exercising the "Install e2e test dependencies" step that was failing.
# DELETE this file in this same PR before merge.
name: "zz-temp validate macOS 15 cache-scope"

on:
  push:
    branches: [test/ron/e2e-fix-macos-cache-scope-workflow]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate-macos15:
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-macos-15-x86_64.yml
    secrets: inherit
    with:
      build_from_source: false
      test_selector: tests/smoke/startup.test.ts

  validate-macos26:
    uses: ./.github/workflows/os-test-e2e-rstudio-desktop-os-macos-26-arm64.yml
    secrets: inherit
    with:
      build_from_source: false
      test_selector: tests/smoke/startup.test.ts
