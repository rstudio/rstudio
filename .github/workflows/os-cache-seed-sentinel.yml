name: "Cache Seed: Sentinel (re-seed evicted E2E build caches)"

# The repo's GitHub Actions cache quota is 10 GB; past it, GitHub evicts
# entries least-recently-used first -- including the build caches the seed
# workflows maintain on main. PR runs can only restore caches from their own
# merge ref or from main, so once main's copy is evicted every PR build goes
# cold (full dependency download + GWT recompile) until the next nightly
# seed. This sentinel closes that gap: it periodically checks that each
# expected cache-key prefix still resolves on refs/heads/main and dispatches
# the owning seed workflow when one has gone missing.
#
# Ubuntu 26 AMD64 and macOS 14 ARM64 have no seed workflow and are not part of
# the PR orchestrator, so they are deliberately absent from the checks below.
# macOS 14's routine runs install the daily .dmg and skip its build job, so the
# build caches a seed would maintain are never read on that path.
on:
  schedule:
    # Every 2 hours, offset from the nightly seeds (07:00 / 07:30 UTC).
    - cron: '45 */2 * * *'
  workflow_dispatch:

concurrency:
  group: cache-seed-sentinel
  cancel-in-progress: true

permissions:
  # Needed both to list caches / workflow runs and to dispatch the seed
  # workflows via `gh workflow run`.
  actions: write
  # Needed to open an alert issue when a seed workflow's latest run failed.
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-seed platforms whose main caches were evicted
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job; gh needs the repo set explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          # One line per seed workflow: <workflow-file>=<cache-key prefixes>.
          # The prefixes must track the cache keys in the matching build
          # workflows (see the "Restore rstudio-tools deps" etc. steps). The
          # rstudio-tools / rlibs linux keys are shared by the Desktop and
          # Server Ubuntu 24 builds, so they are listed once, under the
          # Desktop seed; each seed re-warms every cache its build job
          # touches, missing or not.
          #
          # The os-cache-seed-e2e-deps.yml prefixes are the os-e2e-deps cache
          # keys the PR orchestrator's e2e jobs read: <CACHE_OS>-{r,pak}-<R
          # major.minor>- plus the R-version-independent <CACHE_OS>-pw-
          # browser keys. The 4.5 in the r/pak prefixes tracks the R version
          # the PR orchestrator pins (os-test-e2e-rstudio-pr.yml r_version,
          # currently 4.5.3) as resolved to major.minor -- when that pin is
          # bumped, bump these prefixes and the seed's R_VERSION together.
          CHECKS='
          os-cache-seed-e2e-rstudio-desktop-os-ubuntu-24.yml=rstudio-tools-linux-x86_64- rstudio-build-rlibs-linux-x86_64- rstudio-gwt-linux-desktop-x86_64-
          os-cache-seed-e2e-rstudio-server-os-ubuntu-24.yml=rstudio-gwt-linux-x86_64-
          os-cache-seed-e2e-macos-26-arm64.yml=rstudio-tools-arm64- rstudio-build-rlibs-arm64- rstudio-gwt-arm64-
          os-cache-seed-e2e-macos-15-x86_64.yml=rstudio-tools-x86_64- rstudio-build-rlibs-x86_64- rstudio-gwt-x86_64-
          os-cache-seed-e2e-rstudio-desktop-os-windows-server-2025.yml=rstudio-tools-win64- rstudio-gwt-win64-
          os-cache-seed-e2e-deps.yml=Windows-r-4.5- Windows-pak-4.5- Windows-pw- macOS-macos26-arm64-r-4.5- macOS-macos26-arm64-pak-4.5- macOS-macos26-arm64-pw- Linux-noble-amd64-r-4.5- Linux-noble-amd64-pak-4.5- Linux-noble-amd64-pw- Linux-r-4.5- Linux-pak-4.5- Linux-pw-
          '

          FAILED=0
          while IFS= read -r LINE; do
            # Trim leading whitespace; skip blank lines.
            LINE="${LINE#"${LINE%%[![:space:]]*}"}"
            if [ -z "$LINE" ]; then
              continue
            fi

            SEED="${LINE%%=*}"
            PREFIXES="${LINE#*=}"

            MISSING=""
            for PREFIX in $PREFIXES; do
              # The caches API `key` parameter matches by prefix, so this asks
              # "does any cache under this prefix still exist in main's scope?"
              COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=$PREFIX&per_page=1" --jq .total_count)
              if [ "$COUNT" -eq 0 ]; then
                MISSING="$MISSING $PREFIX"
              fi
            done

            if [ -z "$MISSING" ]; then
              echo "OK: $SEED -- all prefixes present on main"
              continue
            fi
            echo "Evicted from main:$MISSING"

            # Don't dispatch on top of an active run: the seeds' concurrency
            # groups cancel in-flight runs, so piling on dispatches could keep
            # a seed from ever finishing.
            ACTIVE=0
            for STATUS in queued in_progress; do
              N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$SEED/runs?status=$STATUS&per_page=1" --jq .total_count)
              ACTIVE=$((ACTIVE + N))
            done
            if [ "$ACTIVE" -gt 0 ]; then
              echo "Seed $SEED is already queued or running; not dispatching."
              continue
            fi

            echo "Dispatching $SEED"
            gh workflow run "$SEED" --ref main || FAILED=1
          done <<EOF
          $CHECKS
          EOF

          # The cache checks above only notice a failing seed once its caches
          # have actually been evicted, and some failure modes are invisible
          # to the seed workflow itself (startup_failure never runs any job
          # that could report it -- the Windows seed startup-failed silently
          # on two consecutive weekends). Check each seed's latest completed
          # run directly and open an alert issue when it did not succeed.
          for SEED in $(printf '%s\n' "$CHECKS" | sed -n 's/^[[:space:]]*\([^=]*\)=.*/\1/p'); do
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$SEED/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0] | "\(.conclusion) \(.html_url)"')
            CONCLUSION="${RUN%% *}"
            RUN_URL="${RUN#* }"

            TITLE="cache seed workflow failing: $SEED"
            ISSUE=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

            # No completed runs yet (new seed) counts as healthy.
            if [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "null" ]; then
              continue
            fi

            # Recovered: retire the alert from the earlier failure, so a
            # transient flake doesn't leave an issue for someone to close by
            # hand (and doesn't suppress alerting on the next real breakage).
            if [ "$CONCLUSION" = "success" ]; then
              if [ -n "$ISSUE" ]; then
                echo "Seed $SEED recovered; closing #$ISSUE"
                COMMENT=$(printf '%s\n\n%s' \
                  "The latest completed run of \`$SEED\` succeeded: $RUN_URL" \
                  "(Closed automatically by the cache-seed sentinel.)")
                gh issue close "$ISSUE" --reason completed --comment "$COMMENT" || FAILED=1
              fi
              continue
            fi
            echo "Seed $SEED latest completed run: $CONCLUSION"

            # One open issue per seed; skip if the previous alert is still open.
            if [ -n "$ISSUE" ]; then
              echo "Alert issue already open for $SEED (#$ISSUE)"
              continue
            fi

            # A failing conclusion is stale the moment a newer run is queued or
            # running -- including one this job dispatched above, since that
            # dispatch happens before this check. Let the retry settle before
            # calling the seed broken; transient infrastructure faults (DNS,
            # runner loss) clear on their own and would otherwise file an issue
            # that is already obsolete when it is opened.
            PENDING=0
            for STATUS in queued in_progress; do
              N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$SEED/runs?status=$STATUS&per_page=1" --jq .total_count)
              PENDING=$((PENDING + N))
            done
            if [ "$PENDING" -gt 0 ]; then
              echo "Seed $SEED has a newer run in flight; deferring alert."
              continue
            fi

            # Every seed but one maintains build caches. os-cache-seed-e2e-deps
            # runs no build at all -- it warms the os-e2e-deps test-dependency
            # caches -- so a generic "build caches" alert sends readers looking
            # in the wrong place.
            case "$SEED" in
              os-cache-seed-e2e-deps.yml)
                IMPACT="Until this seed succeeds again, its R library, pak download, and Playwright browser caches on main can go stale or be evicted, and PR e2e jobs reinstall those dependencies from scratch."
                ;;
              *)
                IMPACT="Until this seed succeeds again, its build caches on main can go stale or be evicted, and PR builds for that platform run cold."
                ;;
            esac

            BODY=$(printf '%s\n\n%s\n\n%s' \
              "The latest completed run of \`$SEED\` finished with conclusion \`$CONCLUSION\`: $RUN_URL" \
              "$IMPACT" \
              "(Opened automatically by the cache-seed sentinel; it skips re-alerting while this issue stays open, and closes it once the seed succeeds again.)")
            gh issue create --title "$TITLE" --body "$BODY" || FAILED=1
          done

          exit $FAILED
