name: Claude PR Assistant

# @claude mentions on this public repository are relayed, via
# repository_dispatch, to the private rstudio-pro repository, where the
# actual Claude workflow (ide-os-claude.yml there) runs against a checkout
# of this repository and posts results back through the
# workbench-ide-release GitHub App. Platform policy does not allow LLM workflows or model
# credentials on public repositories (posit-dev/platform-infra#317), so
# this workflow must remain a thin, LLM-free relay.
#
# All free text (titles, comment bodies) stays on this side: the dispatch
# payload carries only numbers, usernames, and a pre-slugged branch prefix,
# so the receiving workflow never has to sanitize anything.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  relay:
    # This is a public repository, so gate on author association: only
    # owners, organization members, and collaborators may invoke the
    # assistant. Anyone else mentioning @claude is a no-op.
    #
    # contains() is a substring test and fires on quoted text, code, and
    # HTML comments too; it is only the cheap prefilter for the step below.
    #
    # The repository check keeps copies of this file inert: the receiver
    # always acts on rstudio/rstudio, so a copy running in a fork or in
    # rstudio-pro would point it at this repository's unrelated item with
    # the same number.
    if: |
      github.repository == 'rstudio/rstudio' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
      )
    # Keyed per mention, so a duplicate delivery waits for the first run and
    # then finds its eyes reaction (see Acknowledge mention); otherwise two
    # runs starting together could both see 201 and both relay. Only
    # duplicates share a key, so GitHub's one-pending-run-per-group limit
    # never drops a distinct mention. Never cancel in progress: that would
    # cancel the first run, perhaps mid-dispatch, in favor of the duplicate.
    concurrency:
      group: os-claude-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      # A mention counts only outside blockquotes, code spans, fenced code,
      # and HTML comments, so quoting someone else's "@claude ..." does not
      # re-trigger the assistant. Bodies are free text, so they are passed
      # through the environment and never interpolated into script text.
      # The receiver's gate re-verifies the mention with the same filter;
      # keep the two identical (ide-os-claude.yml in rstudio-pro).
      - name: Check for an effective mention
        id: mention
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          if printf '%s' "$BODY" | perl -0777 -ne '
                s/^[ \t]*(```|~~~).*?(?:^[ \t]*\1[^\n]*$|\z)//msg;  # fenced code blocks
                s/<!--.*?-->//sg;                                    # HTML comments
                s/`[^`\n]*`//g;                                      # code spans
                s/^[ \t]*>[^\n]*$//mg;                               # blockquote lines
                exit(/(^|[^[:alnum:]_-])\@claude([^[:alnum:]_-]|$)/i ? 0 : 1);
              '
          then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No @claude mention outside quoted text, code, or comments; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Titles are free text, so they are passed through the environment and
      # never interpolated into script text.
      - name: Compute dispatch payload
        if: steps.mention.outputs.found == 'true'
        id: payload
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          NUMBER="${ISSUE_NUMBER:-$PR_NUMBER}"
          TITLE="${ISSUE_TITLE:-$PR_TITLE}"

          # printf + tr -d '\n' force the slug to a single line even if a
          # crafted title were to smuggle a newline in: one surviving into
          # GITHUB_OUTPUT would let a public user's issue title inject
          # arbitrary step outputs.
          SLUG=$(printf '%s' "$TITLE" | tr -d '\n' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//' | cut -c1-40 | sed 's/-$//')
          SLUG="${SLUG:-issue}"

          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch-prefix=claude/${NUMBER}-${SLUG}-" >> "$GITHUB_OUTPUT"

      # The ack doubles as a duplicate check: GitHub sometimes starts this
      # workflow twice for one comment, which would relay it twice and get
      # two replies. The reactions API answers 200 rather than 201 when this
      # account's eyes reaction already exists, and only this workflow reacts
      # as github-actions[bot] here, so a 200 means another run took the
      # mention. A re-run always relays, and a failed reaction never blocks
      # the relay. Reviews have no reactions API, so they get neither; there
      # the only ack is Claude's reply.
      - name: Acknowledge mention
        if: steps.mention.outputs.found == 'true'
        id: ack
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.payload.outputs.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$EVENT_NAME" in
            issue_comment) TARGET="issues/comments/${COMMENT_ID}" ;;
            pull_request_review_comment) TARGET="pulls/comments/${COMMENT_ID}" ;;
            issues) TARGET="issues/${NUMBER}" ;;
            *) exit 0 ;;
          esac

          if ! RESPONSE=$(gh api --include --method POST "repos/${REPO}/${TARGET}/reactions" -f content=eyes); then
            echo "::warning::Failed to add the eyes reaction"
            exit 0
          fi
          STATUS=$(head -n 1 <<< "$RESPONSE" | awk '{ print $2 }')
          if [ "$STATUS" = 200 ] && [ "$RUN_ATTEMPT" = 1 ]; then
            echo "::notice::Another run already relayed this mention; skipping."
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate token for GitHub App
        if: steps.mention.outputs.found == 'true' && steps.ack.outputs.duplicate != 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKBENCH_IDE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.WORKBENCH_IDE_RELEASE_PEM }}
          owner: rstudio
          repositories: rstudio-pro
          permission-contents: write

      - name: Relay to rstudio-pro
        if: steps.mention.outputs.found == 'true' && steps.ack.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ steps.payload.outputs.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_ID: ${{ github.event.review.id }}
          # Keep the mention author even when another maintainer reruns the workflow.
          ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
          BRANCH_PREFIX: ${{ steps.payload.outputs.branch-prefix }}
        run: |
          gh api repos/rstudio/rstudio-pro/dispatches \
            -f event_type=os-claude \
            -f "client_payload[event_name]=${EVENT_NAME}" \
            -f "client_payload[number]=${NUMBER}" \
            -f "client_payload[is_pr]=${IS_PR}" \
            -f "client_payload[comment_id]=${COMMENT_ID}" \
            -f "client_payload[review_id]=${REVIEW_ID}" \
            -f "client_payload[actor]=${ACTOR}" \
            -f "client_payload[branch_prefix]=${BRANCH_PREFIX}"
