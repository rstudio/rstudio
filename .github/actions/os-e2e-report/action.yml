name: "Merge and report E2E results"
description: >
  The body of an engine workflow's e2e-merge job: merge the per-shard Playwright
  blob reports into one HTML report, parse the aggregated counts, upload the
  report as an artifact, publish a browsable copy to S3 on failure, post a
  sticky PR comment with the totals, and optionally fail the job when the run
  executed no tests. Every engine runs this behind a checkout, so the comment
  format, the artifact naming, and the release gate live in one place.

  The calling job must have checked out the repository (a local action cannot
  be resolved before that) and must grant pull-requests: write for the comment
  and id-token: write for the S3 upload.

inputs:
  label:
    description: >-
      The engine label its shards used for their artifacts. Blob reports are
      downloaded from playwright-blob-report-<label>-*, the merged report is
      uploaded as playwright-report-<label>, the S3 copy is published under
      <label>, and the sticky comment is keyed e2e-<label>-results.
    required: true
  title:
    description: "Heading of the PR comment, e.g. 'macOS Desktop E2E - ARM64'."
    required: true
  runner-note:
    description: "Runner description for the comment footer, e.g. 'macos-26 ARM64'."
    required: true
  shard-count:
    description: "Number of shards the engine ran, for the comment footer."
    required: true
  result:
    description: "The e2e job's needs.<job>.result; anything but 'success' reports the run as failed."
    required: true
  post-pr-comment:
    description: "Post the sticky PR comment ('true' / 'false')."
    required: false
    default: "false"
  require-tests-passed:
    description: "Fail when zero tests passed ('true' / 'false'); see the gate step for why a zero-passed run must not report green."
    required: false
    default: "false"
  publish-report:
    description: >-
      Allow publishing the report to S3 on failure ('true' / 'false').
      Accessibility runs pass 'false' so their results stay off the public
      bucket however the run was started.
    required: false
    default: "true"
  role-arn:
    description: "IAM role assumed via OIDC for the S3 upload (secrets.AWS_E2E_REPORTS_ROLE_ARN). Empty, as on fork PRs, makes publishing a no-op."
    required: false
    default: ""
  github-token:
    description: "Token used to post the sticky PR comment (github.token)."
    required: true

outputs:
  passed:
    description: "Number of passed tests."
    value: ${{ steps.summary.outputs.passed }}
  failed:
    description: "Number of failed tests."
    value: ${{ steps.summary.outputs.failed }}
  skipped:
    description: "Number of skipped tests."
    value: ${{ steps.summary.outputs.skipped }}
  flaky:
    description: "Number of flaky tests."
    value: ${{ steps.summary.outputs.flaky }}
  run-under-test:
    description: "The build under test as the summarizer names it, or empty when the merged report does not say."
    value: ${{ steps.summary.outputs.run_under_test_1 }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: e2e/rstudio/package-lock.json

    # --ignore-scripts skips the postinstall that downloads browser binaries;
    # this job only invokes `playwright merge-reports`, which doesn't need
    # Chromium. Saves ~30s + ~150MB of downloads per merge job.
    - name: Install Playwright
      shell: bash
      working-directory: e2e/rstudio
      run: npm ci --ignore-scripts

    # Engine-scoped glob: in a combined parent run every other engine also
    # publishes blob reports, and the label keeps this merge to our own shards.
    - name: Download shard blob reports
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: playwright-blob-report-${{ inputs.label }}-*
        path: e2e/rstudio/all-blob-reports
        merge-multiple: true

    - name: Merge shard reports
      shell: bash
      working-directory: e2e/rstudio
      run: |
        if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
          echo "::error::No blob reports found -- no shard produced artifacts"
          exit 1
        fi
        npx playwright merge-reports --config merge.config.ts ./all-blob-reports

    # Shared summarizer (also used by the PR run's e2e-merge-all job) so every
    # comment computes pass/fail counts and the rate bar from one definition.
    - name: Parse aggregated results
      id: summary
      if: always()
      shell: bash
      working-directory: e2e/rstudio
      run: node scripts/summarize-merged-report.mjs

    - name: Upload merged Playwright report
      id: upload-report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ inputs.label }}
        path: e2e/rstudio/playwright-report/
        retention-days: 15
        if-no-files-found: ignore

    # Publish a browsable copy of the report to S3 on failure only, so
    # reviewers can inspect it without downloading the zip. Best-effort: a
    # no-op on fork PRs (no secret) and never fails the job.
    - name: Publish report to S3
      id: publish-report
      if: always() && inputs.publish-report == 'true' && steps.summary.outputs.failed != '0' && steps.summary.outputs.failed != ''
      uses: ./.github/actions/os-publish-e2e-report
      with:
        role-arn: ${{ inputs.role-arn }}
        label: ${{ inputs.label }}

    - name: Post E2E results to PR
      if: |
        always() &&
        inputs.post-pr-comment == 'true' &&
        github.event.pull_request.head.repo.fork == false &&
        (steps.summary.outputs.passed != '0' || steps.summary.outputs.failed != '0' || steps.summary.outputs.skipped != '0' || steps.summary.outputs.flaky != '0')
      uses: marocchino/sticky-pull-request-comment@447031a6bb83f7438d890bb0136932be78342022 # v3.0.0
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        header: e2e-${{ inputs.label }}-results
        message: |
          ## ${{ inputs.title }}

          ${{ inputs.result == 'success' && steps.summary.outputs.failed == '0' && '### ✅ All tests passed!' || format('### ❌ {0} test(s) failed', steps.summary.outputs.failed) }}

          `${{ steps.summary.outputs.bar }}` **${{ steps.summary.outputs.rate }}%** pass rate

          | ✅ Passed | ❌ Failed | ⚠️ Skipped | 🔁 Flaky |
          | :---: | :---: | :---: | :---: |
          | **${{ steps.summary.outputs.passed }}** | **${{ steps.summary.outputs.failed }}** | **${{ steps.summary.outputs.skipped }}** | **${{ steps.summary.outputs.flaky }}** |

          ${{ steps.publish-report.outputs.url != '' && format('**[View Report Online]({0})** | ', steps.publish-report.outputs.url) || '' }}**[Download Report](${{ steps.upload-report.outputs.artifact-url }})**

          ---
          <sub>${{ inputs.shard-count == '1' && '1 shard' || format('{0} shards', inputs.shard-count) }} · ${{ inputs.runner-note }} · commit <code>${{ github.event.pull_request.head.sha }}</code> · <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Run #${{ github.run_number }}</a></sub>

    # Release-gate floor, last so the reporting above still runs. A run that
    # executed nothing must not report green: Playwright suppresses its own
    # "no tests found" error whenever --shard is passed (which every engine
    # does), and requireAiCredentials turns a credential lapse into skips --
    # both leave a zero-passed run looking clean.
    - name: Require the run to have executed tests
      if: always() && inputs.require-tests-passed == 'true'
      shell: bash
      env:
        PASSED: ${{ steps.summary.outputs.passed }}
      run: |
        if [ -z "$PASSED" ] || [ "$PASSED" = "0" ]; then
          echo "::error::This run passed 0 tests, so it proves nothing. Refusing to report green."
          exit 1
        fi
        echo "::notice::Gate floor met: $PASSED test(s) passed."
