name: "Resolve daily installer URLs"
description: >-
  Build a per-platform RStudio installer URL for one specific daily version, by
  token-swapping that version into each platform's latest-daily download URL
  from the dailies manifest. Emits an empty string for every platform in two
  cases, which mean different things to the caller: with no version given, an
  empty rstudio_installer_url tells each engine to self-resolve the latest daily;
  when building from source, the engines build and ignore the URL entirely.

# Every *electron* output is named for the daily manifest key it resolves, so an
# engine's url_key matches its config's daily_platform_key with '-' as '_'.
# server_noble is the exception: it resolves the server product for noble-amd64,
# is named for product and platform rather than a manifest key, and is not any
# engine's url_key.
inputs:
  version:
    description: >-
      Daily build to resolve, given as the version string exactly as shown on
      dailies.rstudio.com (e.g. 2026.08.0-daily+44). Empty means the caller
      wants the latest daily, so every output is empty.
    required: false
    default: ""
  build_from_source:
    description: >-
      When "true", the caller builds every engine from source and no URL is
      needed, so every output is empty. Overrides version.
    required: false
    default: "false"
  manifest_url:
    description: >-
      URL of the dailies manifest to read, from
      .github/actions/os-resolve-daily-manifest. Required, with no default on
      purpose: defaulting it would let a caller silently fall back to the
      /rstudio/latest alias, whose index.json lags a branch rollover and once
      had CI installing a Yellow Yarrow binary against main's tests (#18498).
    required: true

outputs:
  rhel10_x86_64:
    description: "RStudio Desktop (Electron) for RHEL 10 x86_64"
    value: ${{ steps.resolve.outputs.rhel10_x86_64 }}
  rhel10_arm64:
    description: "RStudio Desktop (Electron) for RHEL 10 arm64"
    value: ${{ steps.resolve.outputs.rhel10_arm64 }}
  rhel9_x86_64:
    description: "RStudio Desktop (Electron) for RHEL 9 x86_64"
    value: ${{ steps.resolve.outputs.rhel9_x86_64 }}
  rhel9_arm64:
    description: "RStudio Desktop (Electron) for RHEL 9 arm64"
    value: ${{ steps.resolve.outputs.rhel9_arm64 }}
  noble_amd64:
    description: "RStudio Desktop (Electron) for Ubuntu 24 amd64"
    value: ${{ steps.resolve.outputs.noble_amd64 }}
  noble_arm64:
    description: "RStudio Desktop (Electron) for Ubuntu 24 arm64"
    value: ${{ steps.resolve.outputs.noble_arm64 }}
  jammy_amd64:
    description: "RStudio Desktop (Electron) for Ubuntu 22 amd64"
    value: ${{ steps.resolve.outputs.jammy_amd64 }}
  jammy_arm64:
    description: "RStudio Desktop (Electron) for Ubuntu 22 arm64"
    value: ${{ steps.resolve.outputs.jammy_arm64 }}
  resolute_amd64:
    description: "RStudio Desktop (Electron) for Ubuntu 26 amd64"
    value: ${{ steps.resolve.outputs.resolute_amd64 }}
  resolute_arm64:
    description: "RStudio Desktop (Electron) for Ubuntu 26 arm64"
    value: ${{ steps.resolve.outputs.resolute_arm64 }}
  macos:
    description: "RStudio Desktop (Electron) for macOS (universal .dmg, both arches)"
    value: ${{ steps.resolve.outputs.macos }}
  windows:
    description: "RStudio Desktop (Electron) for Windows"
    value: ${{ steps.resolve.outputs.windows }}
  server_noble:
    description: "RStudio Server for Ubuntu 24 amd64"
    value: ${{ steps.resolve.outputs.server_noble }}

runs:
  using: composite
  steps:
    - id: resolve
      name: Build per-platform installer URLs for a specific version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD_FROM_SOURCE: ${{ inputs.build_from_source }}
        MANIFEST_URL: ${{ inputs.manifest_url }}
      run: |
        # Emit empty URLs when building from source (engines build, ignoring
        # any URL) or when no version is given (engines self-resolve the
        # latest daily, keeping their SHA-256 check). Only a specific version
        # needs URLs built here: swap the version token (+ -> -) into each
        # platform's latest download URL.
        if [ "$BUILD_FROM_SOURCE" = "true" ] || [ -z "$VERSION" ]; then
          {
            echo "rhel10_x86_64="
            echo "rhel10_arm64="
            echo "rhel9_x86_64="
            echo "rhel9_arm64="
            echo "noble_amd64="
            echo "noble_arm64="
            echo "jammy_amd64="
            echo "jammy_arm64="
            echo "resolute_amd64="
            echo "resolute_arm64="
            echo "macos="
            echo "windows="
            echo "server_noble="
          } >> "$GITHUB_OUTPUT"
          echo "No installer URLs to resolve (building from source or using the latest daily)."
          exit 0
        fi
        M=$(curl -fsSL --retry 3 --retry-delay 5 "$MANIFEST_URL")

        REQ=${VERSION//+/-}
        # The whole version token is replaced, not just the build number, so the
        # channel marker and build both come from the version asked for. That is
        # what makes a stale manifest entry harmless: a platform still listed at
        # 2026.08.0-daily+186 resolves correctly for a requested 2026.08.0+187,
        # because "2026.08.0-daily-186" is swapped out wholesale rather than
        # edited in place.
        #
        # This briefly looked broken against the autumn-hawkbit manifest, whose
        # version field read 2026.09.0.0-daily+11 while its filenames carried
        # 2026.09.0-daily-11 -- so the token was not in the URL and every pin
        # tripped the guard below. That was upstream's CALENDAR_VERSION bug
        # (#18492: "2026.09.0" where "2026.09" was meant, giving a four-part
        # version), not a fault here, and the same bug is what broke Windows
        # signing on main. Fixed there; nothing to work around here.
        emit() {
          local product="$1" key="$2" link ver cur
          link=$(printf '%s' "$M" | jq -r ".products.${product}.platforms[\"${key}\"].link // empty")
          ver=$(printf '%s' "$M" | jq -r ".products.${product}.platforms[\"${key}\"].version // empty")
          cur=${ver//+/-}
          if [ -z "$link" ] || [ -z "$cur" ]; then
            echo "::error::Could not build a URL for ${product}/${key} from $MANIFEST_URL." >&2
            return 1
          fi
          local out=${link//$cur/$REQ}
          if [ "$REQ" != "$cur" ] && [ "$out" = "$link" ]; then
            echo "::error::Version '$REQ' did not substitute into the ${product}/${key} URL ($link); the manifest link format may have changed." >&2
            return 1
          fi
          if ! curl -fsI "$out" >/dev/null 2>&1; then
            echo "::error::Resolved URL for ${product}/${key} does not exist: $out (version '$VERSION' may be unavailable or mistyped)." >&2
            return 1
          fi
          printf '%s' "$out"
        }
        # A platform that cannot be resolved yields an empty output, and an empty
        # rstudio_installer_url means "self-resolve the latest daily" to the
        # engines downstream -- so an unnoticed empty would let a version-pinned
        # run quietly test something other than the version asked for. That must
        # never pass silently.
        #
        # It does not follow that every platform has to resolve. Platform builds
        # fail independently: the first Autumn Hawkbit Windows build failed, so
        # that branch's manifest lists eleven platforms and no windows, while
        # Yellow Yarrow's lists twelve. Under an all-or-nothing rule that one
        # failure blocks every pinned run, including Linux-only ones that never
        # touch Windows.
        #
        # So resolution is best-effort here and the *caller* decides what it
        # needs: it knows which cells are selected, and fails the run if any of
        # those came back empty (see the certification workflow's "Verify a
        # pinned version resolved for every selected cell" step). Each failure is
        # still reported, so nothing is hidden -- it is only no longer fatal for a
        # platform nobody asked about.
        #
        # A caller that genuinely needs all of them, like the full-matrix Sunday
        # rotation, gets the same guarantee by checking its own selection.
        # emit() prints the URL on success and nothing on failure, so an empty
        # variable is the failure signal. `|| true` because this step runs under
        # bash -e; without it the first unresolvable platform would abort, which
        # is the all-or-nothing behaviour being removed.
        #
        # Which platforms failed is worked out afterwards, from the values. An
        # earlier version had the wrapper append to a FAILED list, which silently
        # did nothing: command substitution runs in a subshell, so the assignment
        # never reached the parent.
        RHEL10_X86=$(emit electron rhel10-x86_64 || true)
        RHEL10_ARM=$(emit electron rhel10-arm64 || true)
        RHEL9_X86=$(emit electron rhel9-x86_64 || true)
        RHEL9_ARM=$(emit electron rhel9-arm64 || true)
        NOBLE_X86=$(emit electron noble-amd64 || true)
        NOBLE_ARM=$(emit electron noble-arm64 || true)
        JAMMY_X86=$(emit electron jammy-amd64 || true)
        JAMMY_ARM=$(emit electron jammy-arm64 || true)
        RESOLUTE_X86=$(emit electron resolute-amd64 || true)
        RESOLUTE_ARM=$(emit electron resolute-arm64 || true)
        MAC=$(emit electron macos || true)
        WIN=$(emit electron windows || true)
        SERVER=$(emit server noble-amd64 || true)
        FAILED=""
        for pair in \
          "rhel10_x86_64=$RHEL10_X86" "rhel10_arm64=$RHEL10_ARM" \
          "rhel9_x86_64=$RHEL9_X86" "rhel9_arm64=$RHEL9_ARM" \
          "noble_amd64=$NOBLE_X86" "noble_arm64=$NOBLE_ARM" \
          "jammy_amd64=$JAMMY_X86" "jammy_arm64=$JAMMY_ARM" \
          "resolute_amd64=$RESOLUTE_X86" "resolute_arm64=$RESOLUTE_ARM" \
          "macos=$MAC" "windows=$WIN" "server_noble=$SERVER"; do
          [ -n "${pair#*=}" ] || FAILED="$FAILED ${pair%%=*}"
        done
        {
          echo "rhel10_x86_64=$RHEL10_X86"
          echo "rhel10_arm64=$RHEL10_ARM"
          echo "rhel9_x86_64=$RHEL9_X86"
          echo "rhel9_arm64=$RHEL9_ARM"
          echo "noble_amd64=$NOBLE_X86"
          echo "noble_arm64=$NOBLE_ARM"
          echo "jammy_amd64=$JAMMY_X86"
          echo "jammy_arm64=$JAMMY_ARM"
          echo "resolute_amd64=$RESOLUTE_X86"
          echo "resolute_arm64=$RESOLUTE_ARM"
          echo "macos=$MAC"
          echo "windows=$WIN"
          echo "server_noble=$SERVER"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$FAILED" ]; then
          echo "::warning::No installer URL for version $VERSION on:$FAILED. Their outputs are empty; a caller that needs one of these must fail rather than let an engine self-resolve a different build."
        fi
        echo "Resolved URLs for version $VERSION."
