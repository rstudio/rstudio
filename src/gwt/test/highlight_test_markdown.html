<html>
<head>
  <script type="text/javascript" src="../src/org/rstudio/studio/client/workbench/views/source/editors/text/ace/ace-uncompressed.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/yaml_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/utils.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/rainbow_paren_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/python_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/sh_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/stan_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/sql_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/mermaid_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/markdown_highlight_rules.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/markdown_folding.js"></script>
  <script type="text/javascript" src="../acesupport/acemode/markdown.js"></script>
</head>
<body>

  <h2>Markdown Highlight Tester</h2>
  <p>Passed: <span id="passed"></span>, Failed: <span id="failed"></span></p>
  <pre id="log"></pre>

  <script type="text/javascript">

  var MarkdownMode = require("mode/markdown").Mode;
  var EditSession = require("ace/edit_session").EditSession;
  var markdownHighlightRules = require("mode/markdown_highlight_rules");

  // each case tokenizes a fresh document top-to-bottom and asserts the
  // first token type on the listed rows
  var cases = [
    {
      name: "fences colored by nesting depth; siblings share, open/close match",
      lines: [
        ":::::: {#1}",     //  0
        "something",
        "",
        "::::: {#1.1}",    //  3
        "something",
        "",
        "::: {#1.1.1}",    //  6
        "something",
        ":::",             //  8
        "",
        "::: {#1.1.2}",    // 10
        "something",
        ":::",             // 12
        ":::::",           // 13
        "::::::"           // 14
      ],
      expect: {
        0: "fenced_div_0",
        3: "fenced_div_1",
        6: "fenced_div_2",
        8: "fenced_div_2",
        10: "fenced_div_2",
        12: "fenced_div_2",
        13: "fenced_div_1",
        14: "fenced_div_0"
      }
    },
    {
      name: "unmatched closing fence clamps at depth 0",
      lines: [
        ":::",             // 0: stray close; without the clamp this would
        "",                //    poison later fences with 'fenced_div_-1'
        "::: {#a}",        // 2
        "x",
        ":::"              // 4
      ],
      expect: {
        0: "fenced_div_0",
        2: "fenced_div_0",
        4: "fenced_div_0"
      }
    },
    {
      name: "colors wrap after seven nesting levels",
      lines: (function() {
        var out = [];
        for (var i = 0; i < 8; i++)
          out.push("::: {#open" + i + "}");
        for (var i = 0; i < 8; i++)
          out.push(":::");
        return out;
      })(),
      expect: {
        0: "fenced_div_0",
        6: "fenced_div_6",
        7: "fenced_div_0",   // depth 7 wraps back to the first color
        8: "fenced_div_0",
        9: "fenced_div_6",
        15: "fenced_div_0"
      }
    },
    {
      // pandoc's markdown reader (used for Rmd / qmd) requires fences to
      // start at column 0; an indented ':::' is plain text, so '#b' below
      // is nested inside the still-open '#a', not a sibling
      name: "indented colons are not fences",
      lines: [
        "::: {#a}",        // 0
        "x",
        "  :::",           // 2: not a fence; does not close '#a'
        "",
        "::: {#b}",        // 4
        "y",
        ":::"              // 6
      ],
      expect: {
        0: "fenced_div_0",
        4: "fenced_div_1",
        6: "fenced_div_1"
      }
    },
    {
      name: "fences are plain operators when rainbow is disabled",
      rainbow: false,
      lines: [
        "::: {#a}",        // 0
        "x",
        ":::"              // 2
      ],
      expect: {
        0: "keyword.operator",
        2: "keyword.operator"
      }
    }
  ];

  var passed = 0;
  var failed = 0;
  var log = document.getElementById("log");

  cases.forEach(function(tc) {
    markdownHighlightRules.setRainbowFencedDivs(tc.rainbow !== false);

    var session = new EditSession(tc.lines.join("\n"));
    session.setMode(new MarkdownMode());

    // tokenize top-to-bottom so row state and context thread correctly
    var tokensByRow = [];
    for (var row = 0; row < session.getLength(); row++)
      tokensByRow[row] = session.getTokens(row);

    Object.keys(tc.expect).forEach(function(key) {
      var row = Number(key);
      var tokens = tokensByRow[row] || [];
      var actual = tokens.length > 0 ? tokens[0].type : "<no tokens>";
      var expected = tc.expect[key];
      if (actual === expected) {
        passed++;
      } else {
        failed++;
        log.textContent += "FAIL [" + tc.name + "] row " + row +
          ": expected " + expected + ", got " + actual + "\n";
      }
    });

    markdownHighlightRules.setRainbowFencedDivs(true);
  });

  document.getElementById("passed").innerText = String(passed);
  document.getElementById("failed").innerText = String(failed);

  </script>

</body>

</html>
